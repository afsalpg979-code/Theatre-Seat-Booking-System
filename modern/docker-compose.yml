services:
  postgres:
    image: postgres:17
    container_name: falcons-theatre-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: falcons_theatre
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - falcons_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: falcons-theatre-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - falcons_redis_data:/data

volumes:
  falcons_postgres_data:
  falcons_redis_data:
